<text x="24" y="330" font-size="12" fill="#5d636c">A last group of 1–6 bytes is padded with zero bits, written in as few characters as it needs,</text>
<text x="24" y="348" font-size="12" fill="#5d636c">and followed by an end marker U+3D01–U+3D06 that records its length.</text>
<text x="600" y="326" font-size="22" fill="#1b1d21">‘8’ → 尀</text>
<text x="686" y="326" font-size="22" fill="#b0402f">㴁</text>
<text x="600" y="352" font-size="10" fill="#5d636c" font-family="monospace">U+5C00  then  U+3D01 (1 byte)</text>
